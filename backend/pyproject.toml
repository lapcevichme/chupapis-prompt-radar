[project]
name = "prompt-radar-backend"
version = "0.1.0"
description = "Prompt Radar backend — модульный монолит FastAPI (стриминговый CQRS)"
authors = [
    { name = "Prompt Radar Team" }
]
requires-python = ">=3.13,<4"
dependencies = [
    "fastapi (>=0.135.1,<0.136.0)",
    "sqlalchemy[asyncio] (>=2.0.48,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "greenlet (>=3.2.4,<4.0.0)",
    "pydantic (>=2.11.0,<3.0.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pyjwt[crypto] (>=2.11.0,<3.0.0)",
    "passlib[argon2] (>=1.7.4,<2.0.0)",
    "python-multipart (>=0.0.22,<0.0.23)",
    "uvicorn (>=0.41.0,<0.42.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "ruff (>=0.14.1,<0.15.0)",
    "pytest (>=8.3.5,<9.0.0)",
    "pytest-asyncio (>=1.1.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "faker (>=37.11.0,<38.0.0)"
]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["migrations/versions"]
