# Single database configuration with an async dbapi.

[alembic]
# path to migration scripts (relative to %(here)s = location of this ini file).
script_location = %(here)s/migrations

# sys.path path, prepended to sys.path if present.
prepend_sys_path = .

path_separator = os

# database URL is set at runtime by migrations/env.py from Settings.DATABASE_URL.
sqlalchemy.url = driver://user:pass@localhost/dbname


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
