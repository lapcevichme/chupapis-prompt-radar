name: prompt-radar

# Full stack: frontend/nginx + backend (API + orchestration + Postgres) + ml-service + qdrant.
# Quick start:  docker compose up -d --build
# Then: login test@gmail.com/test123 at http://localhost:3000, or `make feed`.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-prompt_radar}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "${QDRANT_HOST_PORT:-6333}:6333"
      - "${QDRANT_GRPC_HOST_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # qdrant image ships with no curl; TCP probe is enough for ready-to-accept
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    restart: unless-stopped

  ml-service:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    env_file:
      - path: ./ml_service/.env
        required: false
    environment:
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:-dev-ml-token}
      # Real Qdrant (do not fall back to in-memory mock in compose)
      ALLOW_INMEMORY_STORE: "false"
      QDRANT_REQUIRED: "true"
      QDRANT_URL: http://qdrant:6333
      QDRANT_CONNECT_RETRIES: "20"
      QDRANT_TIMEOUT_SEC: "5"
      ML_META_DB_URL: sqlite:////data/ml/meta.db
      CLASSIFIER_MODEL_PATH: /app/app/models/catboost_task_classifier.cbm
      ML_CONFIG_PATH: /app/config.yaml
    volumes:
      - ml_meta_data:/data/ml
    ports:
      - "${ML_HOST_PORT:-8000}:8000"
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-prompt_radar}
      JWT_SECRET: ${JWT_SECRET:-dev-local-jwt-secret-change-me-please-0123456789}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:8080}
      ML_SERVICE_URL: http://ml-service:8000
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:-dev-ml-token}
      ML_PROCESSING_TIMEOUT_SEC: ${ML_PROCESSING_TIMEOUT_SEC:-600}
      ML_PROCESSING_POLL_INTERVAL_SEC: ${ML_PROCESSING_POLL_INTERVAL_SEC:-1}
      ML_RECOMPUTE_TIMEOUT_SEC: ${ML_RECOMPUTE_TIMEOUT_SEC:-1800}
      # On a clean clone `make up` must show a populated dashboard, not an empty
      # app: seed the three preloaded workspaces from the bundled dataset.
      PRELOAD_DATASETS_ENABLED: ${PRELOAD_DATASETS_ENABLED:-true}
      # Heavy recompute (UMAP+HDBSCAN + LLM naming) costs provider credits, so it
      # stays opt-in: set to true for a full demo, or trigger it from the UI.
      PRELOAD_DATASETS_RECOMPUTE: ${PRELOAD_DATASETS_RECOMPUTE:-false}
      INGEST_TOKEN: ${INGEST_TOKEN:-dev-ingest-token}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-test@gmail.com}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-test123}
      APP_STAGE: ${APP_STAGE:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/ping', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_AUTO_DEMO_LOGIN: ${FRONTEND_AUTO_DEMO_LOGIN:-true}
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Optional local embedding provider: docker compose --profile ollama up -d
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  qdrant_data:
  ml_meta_data:
  ollama_data:
