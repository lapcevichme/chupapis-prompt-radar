server:
  host: "0.0.0.0"
  port: 8000

store:
  qdrant_url: "http://localhost:6333"
  qdrant_collection: "prompt_radar_vectors"
  meta_db_url: "sqlite:///./ml_meta.db"

# offline = Ollama local, online = OpenRouter cloud
# Same model families: qwen3-embedding-4b, gemma ~26B
# Compose: provider keys/modes come from ml_service/.env (env_file), not hard-coded.
models:
  embeddings:
    mode: "offline"   # offline | online | mock
    provider: "ollama"  # resolved from mode; kept for back-compat
    ollama: { model_name: "qwen3-embedding:4b", url: "http://127.0.0.1:11434" }
    openrouter: { model_name: "qwen/qwen3-embedding-4b", url: "https://openrouter.ai/api/v1/embeddings" }

llm:
  mode: "offline"     # offline | online
  provider: "ollama"
  ollama: { model_name: "gemma4:26b-a4b-it", url: "http://127.0.0.1:11434" }
  openrouter: { model_name: "google/gemma-4-26b-a4b-it", url: "https://openrouter.ai/api/v1/chat/completions" }

classifier:
  provider: "catboost"
  model_path: "app/models/catboost_task_classifier.cbm"
  # 0.30: practical demo/prod balance; 0.45 pushed ~half of real traffic to unknown
  confidence_threshold: 0.30
  fallback_mode: "fail_fast"

ingest:
  batch_max_size: 200
  worker_concurrency: 8
  embeddings_batch_size: 32

online_clustering:
  similarity_threshold: 0.85
  recompute_centroid: true

recompute:
  scheduler_enabled: false
  interval_hours: 2
  centroid_match_threshold: 0.75
  # min_cluster_size 10: fewer micro-clusters / lower outlier rate vs 5
  umap: { n_neighbors: 15, n_components: 10, min_dist: 0.0, metric: "cosine", random_state: 42 }
  hdbscan: { min_cluster_size: 10, min_samples: 4, metric: "euclidean", cluster_selection_method: "eom" }
  # Cap scenarios per task_type after HDBSCAN (reassign rest by nearest centroid)
  max_clusters_per_task_type: 5

summarization:
  representative_examples_count: 10
  scenario_name_max_words: 4
  max_llm_retries: 2

aggregation_defaults:
  top_tasks_limit: 7
  top_scenarios_limit: 9
  # Guard cold-start trend artifacts (±100% / +4600%)
  trend_threshold_percent: 15.0
  trend_min_total: 20
  trend_min_previous: 5
