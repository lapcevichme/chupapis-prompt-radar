server:
  host: "0.0.0.0"
  port: 8000

store:
  qdrant_url: "http://localhost:6333"
  qdrant_collection: "prompt_radar_vectors"
  meta_db_url: "sqlite:////data/ml/meta.db"

models:
  embeddings:
    provider: "ollama"  # or openrouter
    ollama: { model_name: "qwen3-embedding:4b", url: "http://localhost:11434/api/embed" }
    openrouter: { model_name: "qwen/qwen3-embedding-4b", url: "https://openrouter.ai/api/v1/embeddings" }

llm:
  provider: "openrouter"
  openrouter: { model_name: "google/gemma-4-26b-a4b-it", url: "https://openrouter.ai/api/v1/chat/completions" }

classifier:
  provider: "catboost"
  model_path: "/app/models/catboost_task_classifier.cbm"
  confidence_threshold: 0.60
  fallback_mode: "llm"

ingest:
  batch_max_size: 200
  worker_concurrency: 8
  embeddings_batch_size: 32

online_clustering:
  similarity_threshold: 0.85

recompute:
  interval_hours: 2
  umap: { n_neighbors: 15, n_components: 10, min_dist: 0.0, metric: "cosine", random_state: 42 }
  hdbscan: { min_cluster_size: 5, min_samples: 3, metric: "euclidean", cluster_selection_method: "eom" }

summarization:
  representative_examples_count: 10
  scenario_name_max_words: 4
  max_llm_retries: 2

aggregation_defaults:
  top_tasks_limit: 7
  top_scenarios_limit: 9
  trend_threshold_percent: 10.0