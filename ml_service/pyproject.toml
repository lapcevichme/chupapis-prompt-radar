[project]
name = "ml-service"
version = "0.1.0"
description = "ML Service for Prompt Radar (CQRS streaming)"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "catboost>=1.2.0",
    "umap-learn>=0.5.6",
    "hdbscan>=0.8.40",
    "qdrant-client>=1.9.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "jsonschema>=4.22.0",
    "pyyaml>=6.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "live: real provider integration (no mocks); Ollama or OpenRouter",
    "openrouter: live tests against OpenRouter API",
]
# Default unit run skips live tests (use: pytest tests/live -m live)
addopts = "-m \"not live\""

[tool.ruff]
line-length = 100
target-version = "py311"
